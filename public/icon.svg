<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="#121214" />
  <g filter="url(#shadow)">
    <!-- Elegant stylized notepad sheet -->
    <rect x="110" y="90" width="292" height="332" rx="28" fill="#1e1e24" stroke="#2d2d38" stroke-width="3" />
    
    <!-- Accent stroke ribbon -->
    <path d="M150 170 Q 220 140, 310 180 T 360 250" fill="none" stroke="url(#grad)" stroke-width="14" stroke-linecap="round" />
    
    <!-- Stylus Nib Icon -->
    <path d="M 320 220 L 375 275 L 290 360 L 250 365 L 255 325 Z" fill="#ffffff" />
    <path d="M 305 235 L 360 290" stroke="#7c3aed" stroke-width="3" />
    <circle cx="260" cy="355" r="3" fill="#ec4899" />

    <!-- Text line accents -->
    <rect x="150" y="270" width="80" height="8" rx="4" fill="#3b3b4f" />
    <rect x="150" y="300" width="60" height="8" rx="4" fill="#3b3b4f" />
    <rect x="150" y="330" width="70" height="8" rx="4" fill="#3b3b4f" />
  </g>
</svg>
